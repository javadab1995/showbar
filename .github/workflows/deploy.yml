name: ShowBar CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: https://qgycqwkulgtkuwcjhpzy.supabase.co/functions/v1
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -eu
          cd /apps/showbar

          git pull --ff-only origin master
          npm ci

          export VITE_API_URL="https://qgycqwkulgtkuwcjhpzy.supabase.co/functions/v1"
          npm run build

          docker compose up -d --build --force-recreate

          curl -fsS http://127.0.0.1:8080/ >/dev/null
          docker compose ps
          REMOTE
