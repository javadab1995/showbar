name: ShowBar CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: https://qgycqwkulgtkuwcjhpzy.supabase.co/functions/v1
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -eu

          echo "Testing SSH connection..."

          ssh -vvv \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH connected successfully"; whoami; hostname'

          echo "Starting deployment..."

          ssh \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -eu
          cd /apps/showbar

          git pull --ff-only origin master
          npm ci

          export VITE_API_URL="https://qgycqwkulgtkuwcjhpzy.supabase.co/functions/v1"
          npm run build

          docker compose up -d --build --force-recreate

          for attempt in $(seq 1 12); do
            if curl --connect-timeout 3 --max-time 10 -fsS http://127.0.0.1:8080/ >/dev/null; then
              echo "ShowBar is responding."
              break
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "ShowBar did not become ready in time."
              docker compose ps
              docker compose logs --tail=60 showbar showbar-api
              exit 1
            fi

            echo "Waiting for ShowBar... attempt $attempt/12"
            sleep 5
          done

          docker compose ps
          REMOTE
